[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-knowledge-agent"
version = "0.1.0"
description = "Extract traceable knowledge from videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
groq = [
  "av>=14.0.0",
  "groq>=0.33.0",
  "numpy>=1.26.0",
]
openai = ["openai>=1.68.0"]
media = [
  "av>=14.0.0",
  "imageio-ffmpeg>=0.5.1",
  "faster-whisper>=1.1.0",
]
ocr = [
  "av>=14.0.0",
  "Pillow>=10.0.0",
  "rapidocr>=3.10.0",
  "onnxruntime>=1.17.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
video-knowledge = "video_knowledge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
